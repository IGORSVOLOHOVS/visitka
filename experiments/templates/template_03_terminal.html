<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; }
    .card {
        width: 1119px;
        height: 615px;
        background: #282c34;
        display: flex;
        flex-direction: column;
    }
    .titlebar {
        height: 58px;
        background: #21252b;
        display: flex;
        align-items: center;
        padding: 0 18px;
        gap: 10px;
        border-bottom: 1px solid #181a1f;
    }
    .dot { width: 15px; height: 15px; border-radius: 50%; }
    .dot.red { background: #e0605066; border: 1px solid #e06c75; }
    .dot.yellow { background: #e5c07b66; border: 1px solid #e5c07b; }
    .dot.green { background: #98c37966; border: 1px solid #98c379; }
    .filename {
        margin-left: 16px;
        color: #5c6370;
        font-size: 30px;
    }
    .body {
        flex: 1;
        padding: 22px 46px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .code { font-size: 30px; line-height: 1.4; }
    .ln { color: #495162; display: inline-block; width: 34px; user-select: none; }
    .kw { color: #c678dd; }
    .str { color: #98c379; }
    .prop { color: #e06c75; }
    .punct { color: #abb2bf; }
    .com { color: #5c6370; }
    .cursor {
        display: inline-block;
        width: 12px; height: 26px;
        background: #98c379;
        vertical-align: text-bottom;
        margin-left: 4px;
    }
    .avatar-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding-left: 20px;
    }
    .avatar-panel .tab {
        color: #5c6370;
        font-size: 30px;
        align-self: flex-start;
        margin-left: 4px;
    }
    .avatar-panel img {
        width: 220px;
        height: 220px;
        object-fit: cover;
        border: 2px solid #3a3f4b;
        padding: 10px;
        background: #21252b;
        border-radius: 4px;
    }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="titlebar">
            <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
            <div class="filename">~/contact.ts</div>
        </div>
        <div class="body">
            <div class="code">
                <div><span class="ln">1</span><span class="kw">const</span> <span class="prop">engineer</span> <span class="punct">=</span> <span class="punct">{</span></div>
                <div><span class="ln">2</span>&nbsp;&nbsp;<span class="prop">name</span><span class="punct">:</span> <span class="str">"{{ name }}"</span><span class="punct">,</span></div>
                <div><span class="ln">3</span>&nbsp;&nbsp;<span class="prop">role</span><span class="punct">:</span> <span class="str">"{{ title }}"</span><span class="punct">,</span></div>
                <div><span class="ln">4</span>&nbsp;&nbsp;<span class="prop">phone</span><span class="punct">:</span> <span class="str">"{{ phone }}"</span><span class="punct">,</span></div>
                <div><span class="ln">5</span>&nbsp;&nbsp;<span class="prop">email</span><span class="punct">:</span> <span class="str">"{{ email }}"</span><span class="punct">,</span></div>
                <div><span class="ln">6</span>&nbsp;&nbsp;<span class="prop">stack</span><span class="punct">:</span> <span class="punct">[</span></div>
                {% for tag in tags %}<div><span class="ln">{{ 7 + loop.index0 }}</span>&nbsp;&nbsp;&nbsp;&nbsp;<span class="str">"{{ tag }}"</span><span class="punct">,</span></div>
                {% endfor %}<div><span class="ln">{{ 7 + tags|length }}</span>&nbsp;&nbsp;<span class="punct">],</span></div>
                <div><span class="ln">{{ 8 + tags|length }}</span><span class="punct">}</span><span class="cursor"></span>&nbsp;&nbsp;<span class="com">// {{ cta }}</span></div>
            </div>
            <div class="avatar-panel">
                <span class="tab">avatar.png</span>
                <img src="{{ photo_uri }}" alt="Igors Volohovs">
            </div>
        </div>
    </div>
</body>
</html>
