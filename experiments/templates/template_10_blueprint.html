<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Mono', monospace; }
    .card {
        width: 1119px;
        height: 615px;
        background: #0e2a47;
        position: relative;
        overflow: hidden;
        color: #eaf2fb;
        padding: 34px 50px;
    }
    .grid {
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(234,242,251,0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(234,242,251,0.08) 1px, transparent 1px);
        background-size: 28px 28px;
    }
    .grid-major {
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(234,242,251,0.16) 1px, transparent 1px),
            linear-gradient(90deg, rgba(234,242,251,0.16) 1px, transparent 1px);
        background-size: 140px 140px;
    }
    .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
    .header { display: flex; justify-content: space-between; font-size: 30px; letter-spacing: 1px; color: #7fa4c9; text-transform: uppercase; }
    .dim-line { position: relative; margin: 14px 0 10px; }
    .dim-line .line { height: 1px; background: #7fa4c9; position: relative; }
    .dim-line .line::before, .dim-line .line::after { content: ""; position: absolute; top: -4px; width: 1px; height: 9px; background: #7fa4c9; }
    .dim-line .line::before { left: 0; } .dim-line .line::after { right: 0; }
    .name {
        font-size: 50px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #ffffff;
    }
    .title { margin-top: 6px; font-size: 30px; color: #7fa4c9; letter-spacing: 1px; text-transform: uppercase; }
    .title::before { content: "REF / "; color: #4a6f92; }
    .titleblock {
        border: 1.5px solid #7fa4c9;
        display: grid;
        grid-template-columns: 1fr 1.3fr 1.1fr;
    }
    .titleblock .cell { border-right: 1.5px solid #7fa4c9; padding: 10px 16px; }
    .titleblock .cell:last-child { border-right: none; }
    .titleblock .label { font-size: 30px; letter-spacing: 1px; color: #7fa4c9; text-transform: uppercase; margin-bottom: 6px; }
    .titleblock .value { font-size: 30px; color: #eaf2fb; line-height: 1.3; word-break: break-word; }
    .photo-component {
        position: absolute;
        right: 50px;
        top: 84px;
        text-align: center;
        z-index: 5;
    }
    .photo-component .frame { border: 1.5px solid #7fa4c9; padding: 8px; background: #0e2a47; }
    .photo-component img { width: 260px; height: 260px; object-fit: cover; display: block; }
    .photo-component .tag { margin-top: 6px; font-size: 30px; letter-spacing: 1px; color: #7fa4c9; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="grid"></div>
        <div class="grid-major"></div>
        <div class="photo-component">
            <div class="frame"><img src="{{ photo_uri }}" alt="Igors Volohovs"></div>
            <div class="tag">PHOTO&#8209;01</div>
        </div>
        <div class="content">
            <div>
                <div class="header">
                    <span>DWG NO. IV&#8209;2026&#8209;01</span>
                    <span>SCALE 1:1</span>
                </div>
                <div class="dim-line"><div class="line"></div></div>
                <div class="name">{{ name }}</div>
                <div class="title">{{ title }}</div>
            </div>
            <div class="titleblock">
                <div class="cell">
                    <div class="label">Contact</div>
                    <div class="value">{{ phone }}</div>
                    <div class="value">{{ email }}</div>
                </div>
                <div class="cell">
                    <div class="label">Domains</div>
                    <div class="value">{{ tags|join(', ') }}</div>
                </div>
                <div class="cell">
                    <div class="label">Notes</div>
                    <div class="value">{{ cta }}</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
