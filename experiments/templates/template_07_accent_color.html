<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background: #ffffff;
        position: relative;
        padding: 70px 80px;
        overflow: hidden;
    }
    .accent-circle {
        position: absolute;
        width: 420px; height: 420px;
        border-radius: 50%;
        background: #ff4d1c;
        right: -140px;
        top: -140px;
    }
    .accent-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #ff4d1c; }
    .name { font-weight: 700; font-size: 60px; color: #111; line-height: 1.05; position: relative; z-index: 2; }
    .title {
        display: inline-block;
        margin-top: 14px;
        background: #111;
        color: #ff4d1c;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 7px 16px;
        position: relative;
        z-index: 2;
    }
    .contacts { margin-top: 40px; position: relative; z-index: 2; }
    .contacts div { font-size: 18px; color: #333; margin-bottom: 9px; font-weight: 400; }
    .tags { margin-top: 26px; display: flex; gap: 24px; position: relative; z-index: 2; }
    .tags span { font-size: 14px; font-weight: 700; color: #ff4d1c; text-transform: uppercase; letter-spacing: 1px; }
    .qr-wrap {
        position: absolute;
        right: 80px;
        bottom: 70px;
        z-index: 3;
        background: #fff;
        padding: 10px;
        border: 3px solid #111;
    }
    .qr-wrap img { width: 118px; height: 118px; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="accent-bar"></div>
        <div class="accent-circle"></div>
        <div class="name">{{ name }}</div>
        <div class="title">{{ title }}</div>
        <div class="contacts">
            <div>{{ phone }}</div>
            <div>{{ email }}</div>
            <div>{{ url }}</div>
        </div>
        <div class="tags">
            {% for tag in tags %}<span>{{ tag }}</span>{% endfor %}
        </div>
        <div class="qr-wrap"><img src="{{ qr_uri }}" alt="QR"></div>
    </div>
</body>
</html>
