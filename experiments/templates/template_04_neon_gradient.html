<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Sora', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background:
            radial-gradient(circle at 12% 15%, rgba(255,0,200,0.35), transparent 42%),
            radial-gradient(circle at 85% 20%, rgba(0,229,255,0.30), transparent 45%),
            radial-gradient(circle at 70% 90%, rgba(130,0,255,0.35), transparent 50%),
            #120019;
        position: relative;
        overflow: hidden;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .grid-overlay {
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 38px 38px;
    }
    .content { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
    .left { max-width: 640px; }
    .name {
        font-weight: 800;
        font-size: 62px;
        color: #ffffff;
        line-height: 1.05;
        text-shadow: 0 0 6px #ff2ec4, 0 0 22px #ff2ec4aa, 0 0 46px #7a2effaa;
    }
    .title {
        margin-top: 12px;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #4ce9ff;
        text-shadow: 0 0 10px #4ce9ff88;
    }
    .contacts { margin-top: 30px; display: flex; flex-direction: column; gap: 9px; }
    .contacts div { font-weight: 300; font-size: 17px; color: #e4d9f5; }
    .tags { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
    .tags span {
        font-size: 13px;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 999px;
        color: #ffffff;
        border: 1px solid #ffffff55;
        background: rgba(255,255,255,0.06);
        box-shadow: 0 0 14px rgba(76,233,255,0.35);
    }
    .qr-wrap {
        background: rgba(255,255,255,0.04);
        border: 1px solid #ffffff33;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 0 40px rgba(255,46,196,0.35), 0 0 70px rgba(76,233,255,0.2);
    }
    .qr-wrap img { width: 152px; height: 152px; display: block; border-radius: 6px; image-rendering: pixelated; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="grid-overlay"></div>
        <div class="content">
            <div class="left">
                <div class="name">{{ name }}</div>
                <div class="title">{{ title }}</div>
                <div class="contacts">
                    <div>{{ phone }}</div>
                    <div>{{ email }}</div>
                    <div>{{ url }}</div>
                </div>
                <div class="tags">
                    {% for tag in tags %}<span>{{ tag }}</span>{% endfor %}
                </div>
            </div>
            <div class="qr-wrap"><img src="{{ qr_uri }}" alt="QR"></div>
        </div>
    </div>
</body>
</html>
