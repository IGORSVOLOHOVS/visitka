<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background: #f4f1ea;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 50px;
        padding: 0 50px;
    }
    .photo-anchor {
        position: relative;
        flex: 0 0 auto;
    }
    .photo-anchor img {
        width: 460px;
        height: 460px;
        object-fit: cover;
        border-radius: 50%;
        display: block;
    }
    .ring {
        position: absolute;
        inset: -20px;
        border: 1.5px dashed #1c1c1c55;
        border-radius: 50%;
    }
    .badge {
        position: absolute;
        bottom: -16px;
        left: 50%;
        transform: translateX(-50%);
        background: #1c1c1c;
        color: #f4f1ea;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 1px;
        padding: 8px 20px;
        border-radius: 999px;
        white-space: nowrap;
    }
    .text-side { max-width: 460px; }
    .name {
        font-weight: 700;
        font-size: 58px;
        color: #1c1c1c;
        line-height: 1.05;
    }
    .title {
        font-weight: 500;
        font-size: 30px;
        color: #6b6559;
        margin-top: 8px;
    }
    .divider { width: 44px; height: 3px; background: #1c1c1c; margin: 22px 0; }
    .contacts div { font-size: 30px; color: #37332c; margin-bottom: 9px; }
    .tags { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
    .tags span {
        font-size: 30px;
        font-weight: 500;
        color: #1c1c1c;
        border: 1px solid #1c1c1c;
        padding: 6px 15px;
        border-radius: 999px;
    }
    .tags .divider-glyph {
        border: none;
        padding: 0;
        border-radius: 0;
        color: #b9b3a6;
        font-weight: 400;
        margin: 0 2px;
    }
    .tags .plain-label {
        border: none;
        padding: 0;
        border-radius: 0;
        font-size: 30px;
        font-weight: 500;
        color: #6b6559;
    }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="photo-anchor">
            <div class="ring"></div>
            <img src="{{ photo_uri }}" alt="Igors Volohovs">
            <div class="badge">{{ cta }}</div>
        </div>
        <div class="text-side">
            <div class="name">{{ name }}</div>
            <div class="title">{{ title }}</div>
            <div class="divider"></div>
            <div class="contacts">
                <div>{{ phone }}</div>
                <div>{{ email }}</div>
            </div>
            <div class="tags">
                {% for tag in tags %}<span>{{ tag }}</span>{% if loop.first %}<span class="divider-glyph">|</span><span class="plain-label">C++ / Python</span>{% endif %}{% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
