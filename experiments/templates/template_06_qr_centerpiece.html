<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Space Grotesk', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background: #f4f1ea;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 72px;
        padding: 0 90px;
    }
    .qr-anchor {
        position: relative;
        flex: 0 0 auto;
    }
    .qr-anchor img {
        width: 300px;
        height: 300px;
        display: block;
        mix-blend-mode: multiply; image-rendering: pixelated; }
    .ring {
        position: absolute;
        inset: -22px;
        border: 1.5px dashed #1c1c1c55;
        border-radius: 50%;
    }
    .badge {
        position: absolute;
        bottom: -16px;
        left: 50%;
        transform: translateX(-50%);
        background: #1c1c1c;
        color: #f4f1ea;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 2px;
        padding: 7px 18px;
        border-radius: 999px;
        white-space: nowrap;
        text-transform: uppercase;
    }
    .text-side { max-width: 520px; }
    .name {
        font-weight: 700;
        font-size: 58px;
        color: #1c1c1c;
        line-height: 1.05;
    }
    .title {
        font-weight: 500;
        font-size: 18px;
        color: #6b6559;
        margin-top: 8px;
    }
    .divider { width: 44px; height: 3px; background: #1c1c1c; margin: 22px 0; }
    .contacts div { font-size: 17px; color: #37332c; margin-bottom: 7px; }
    .tags { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
    .tags span {
        font-size: 13px;
        font-weight: 500;
        color: #1c1c1c;
        border: 1px solid #1c1c1c;
        padding: 6px 14px;
        border-radius: 999px;
    }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="qr-anchor">
            <div class="ring"></div>
            <img src="{{ qr_uri }}" alt="QR">
            <div class="badge">Scan me</div>
        </div>
        <div class="text-side">
            <div class="name">{{ name }}</div>
            <div class="title">{{ title }}</div>
            <div class="divider"></div>
            <div class="contacts">
                <div>{{ phone }}</div>
                <div>{{ email }}</div>
                <div>{{ url }}</div>
            </div>
            <div class="tags">
                {% for tag in tags %}<span>{{ tag }}</span>{% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
