<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Archivo', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background: #f4f2ee;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .name {
        font-family: 'Archivo Black', Arial, sans-serif;
        padding: 26px 0 0 0;
        font-size: 122px;
        line-height: 0.88;
        color: #000;
        letter-spacing: -3px;
        white-space: nowrap;
        margin-left: -6px;
    }
    .title-bar {
        display: inline-block;
        align-self: flex-start;
        background: #000;
        color: #f4f2ee;
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 5px;
        text-transform: uppercase;
        padding: 9px 24px;
        margin: 16px 0 0 34px;
    }
    .bottom {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 40px;
    }
    .contacts-wrap { display: flex; flex-direction: column; gap: 8px; }
    .row1 { display: flex; gap: 26px; }
    .contacts-wrap .row1 div { font-weight: 500; font-size: 15px; color: #000; }
    .tags { display: flex; gap: 8px; }
    .tags span { font-size: 12px; font-weight: 700; color: #8a8a8a; }
    .tags span:not(:last-child)::after { content: " /"; color: #ccc; }
    .qr-mini {
        width: 256px; height: 256px;
        border: 3px solid #000;
        padding: 8px;
        flex: none;
        background: #f4f2ee;
    }
    .qr-mini img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="name">{{ name.split(' ')[0] }}<br>{{ name.split(' ')[1] }}</div>
        <div class="title-bar">{{ title }}</div>
        <div class="bottom">
            <div class="contacts-wrap">
                <div class="row1">
                    <div>{{ phone }}</div>
                    <div>{{ email }}</div>
                    <div>{{ url }}</div>
                </div>
                <div class="tags">
                    {% for tag in tags %}<span>{{ tag }}</span>{% endfor %}
                </div>
            </div>
            <div class="qr-mini"><img src="{{ qr_uri }}" alt="QR"></div>
        </div>
    </div>
</body>
</html>
