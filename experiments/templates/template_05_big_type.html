<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Archivo', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background: #f4f2ee;
        position: relative;
        overflow: hidden;
    }
    .name {
        font-family: 'Archivo Black', Arial, sans-serif;
        position: absolute;
        top: 38px;
        left: -8px;
        font-size: 168px;
        line-height: 0.86;
        color: #000;
        letter-spacing: -4px;
        white-space: nowrap;
    }
    .title-bar {
        position: absolute;
        left: 0;
        bottom: 130px;
        background: #000;
        color: #f4f2ee;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 5px;
        text-transform: uppercase;
        padding: 10px 26px 10px 40px;
    }
    .bottom {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 26px 40px;
    }
    .contacts { display: flex; gap: 28px; }
    .contacts div { font-weight: 500; font-size: 15px; color: #000; }
    .tags { display: flex; gap: 8px; margin-top: 6px; }
    .tags span { font-size: 12px; font-weight: 700; color: #8a8a8a; }
    .tags span:not(:last-child)::after { content: " /"; color: #ccc; }
    .contacts-wrap { display: flex; flex-direction: column; gap: 6px; }
    .row1 { display: flex; gap: 28px; }
    .qr-mini {
        width: 108px; height: 108px;
        border: 3px solid #000;
        padding: 6px;
    }
    .qr-mini img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="name">{{ name.split(' ')[0] }}<br>{{ name.split(' ')[1] }}</div>
        <div class="title-bar">{{ title }}</div>
        <div class="bottom">
            <div class="contacts-wrap">
                <div class="row1">
                    <div>{{ phone }}</div>
                    <div>{{ email }}</div>
                    <div>{{ url }}</div>
                </div>
                <div class="tags">
                    {% for tag in tags %}<span>{{ tag }}</span>{% endfor %}
                </div>
            </div>
            <div class="qr-mini"><img src="{{ qr_uri }}" alt="QR"></div>
        </div>
    </div>
</body>
</html>
