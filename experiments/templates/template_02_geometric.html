<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Sora', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background: #f3efe6;
        position: relative;
        overflow: hidden;
    }
    .wedge {
        position: absolute;
        top: 0; left: 0;
        width: 62%;
        height: 100%;
        background: #0d1b2a;
        clip-path: polygon(0 0, 100% 0, 62% 100%, 0% 100%);
    }
    .wedge2 {
        position: absolute;
        top: 0; left: 0;
        width: 68%;
        height: 100%;
        background: #ffb703;
        clip-path: polygon(0 0, 100% 0, 66% 100%, 0% 100%);
        z-index: -1;
    }
    .content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 0 0 78px;
        width: 55%;
    }
    .name {
        font-weight: 800;
        font-size: 50px;
        color: #ffffff;
        line-height: 1.05;
    }
    .title {
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffb703;
        margin-top: 10px;
    }
    .contacts {
        margin-top: 26px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .contacts div {
        font-weight: 400;
        font-size: 30px;
        color: #dfe6ee;
    }
    .cta {
        margin-top: 18px;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 1.5px;
        color: #ffb703;
    }
    .tags {
        position: absolute;
        left: 78px;
        bottom: 40px;
        display: flex;
        gap: 10px;
        z-index: 3;
        flex-wrap: wrap;
    }
    .tags span {
        background: #ffb703;
        color: #0d1b2a;
        font-weight: 700;
        font-size: 30px;
        padding: 7px 14px;
        border-radius: 3px;
        transform: skewX(-8deg);
        display: inline-block;
    }
    .photo-box {
        position: absolute;
        right: 35px;
        bottom: 35px;
        background: #ffffff;
        padding: 12px;
        border-radius: 10px;
        box-shadow: 0 14px 32px rgba(13,27,42,0.3);
    }
    .photo-box img {
        width: 380px; height: 380px;
        object-fit: cover;
        display: block;
        border-radius: 4px;
    }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="wedge2"></div>
        <div class="wedge"></div>
        <div class="content">
            <div class="name">{{ name }}</div>
            <div class="title">{{ title }}</div>
            <div class="contacts">
                <div>{{ phone }}</div>
                <div>{{ email }}</div>
            </div>
            <div class="cta">{{ cta }}</div>
        </div>
        <div class="tags">
            {% for tag in tags %}<span>{{ tag }}</span>{% endfor %}
        </div>
        <div class="photo-box"><img src="{{ photo_uri }}" alt="Igors Volohovs"></div>
    </div>
</body>
</html>
