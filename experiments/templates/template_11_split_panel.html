<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        position: relative;
        overflow: hidden;
        background: #ececec;
    }
    .top-row {
        display: flex;
        height: 545px;
    }
    .left {
        flex: 0 0 420px;
        background: linear-gradient(160deg, #202020, #4a4a4a);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .photo-circle {
        width: 320px; height: 320px;
        border-radius: 50%;
        overflow: hidden;
        border: 6px solid rgba(255,255,255,0.15);
    }
    .photo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .right {
        flex: 1;
        padding: 0 56px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .name { font-weight: 800; font-size: 60px; color: #111; line-height: 1.05; }
    .title { margin-top: 8px; font-size: 30px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #6b6b6b; }
    .contacts { margin-top: 22px; display: flex; flex-direction: column; gap: 6px; }
    .contacts div { font-size: 30px; color: #333; }
    .experience { margin-top: 10px; font-size: 30px; color: #333; }
    .experience b { font-weight: 800; color: #111; }
    .cta { margin-top: 16px; font-size: 30px; font-weight: 700; color: #e8871e; letter-spacing: 0.5px; }
    .tag-bar {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 70px;
        background: #f5a623;
        display: flex;
        align-items: center;
        padding: 0 56px;
    }
    .tag-bar span { font-size: 30px; font-weight: 700; color: #1c1c1c; }
    .tag-bar .sep { margin: 0 16px; color: #8a6a10; font-weight: 400; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="top-row">
            <div class="left">
                <div class="photo-circle"><img src="{{ photo_uri }}" alt="Igors Volohovs"></div>
            </div>
            <div class="right">
                <div class="name">{{ name }}</div>
                <div class="title">{{ title }}</div>
                <div class="contacts">
                    <div>{{ phone }}</div>
                    <div>{{ email }}</div>
                </div>
                <div class="experience"><b>5+</b> years experience</div>
                <div class="cta">{{ cta }}</div>
            </div>
        </div>
        <div class="tag-bar">
            {% for tag in tags %}<span>{{ tag }}</span>{% if not loop.last %}<span class="sep">|</span>{% endif %}{% endfor %}
        </div>
    </div>
</body>
</html>
