<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background: #ffffff;
        border: 1px solid #d9dee5;
        padding: 34px 72px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
    }
    .left { text-align: left; flex: 1; }
    .monogram {
        width: 70px; height: 70px;
        border: 2px solid #0b2545;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-family: 'IBM Plex Serif', serif;
        font-weight: 600;
        font-size: 30px;
        color: #0b2545;
        margin-bottom: 16px;
    }
    .name {
        font-family: 'IBM Plex Serif', serif;
        font-weight: 600;
        font-size: 38px;
        color: #0b2545;
        letter-spacing: 0.5px;
    }
    .title {
        margin-top: 6px;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #8b93a1;
    }
    .hr { width: 80px; height: 1px; background: #c9a24b; margin: 18px 0; }
    .contacts { display: flex; flex-direction: column; gap: 6px; font-size: 30px; color: #33445c; font-weight: 400; }
    .tags { margin-top: 16px; display: flex; gap: 18px; flex-wrap: wrap; }
    .tags span { font-size: 30px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #0b2545; }
    .right {
        flex: none;
        text-align: center;
        padding-left: 40px;
        border-left: 1px solid #e4e8ee;
    }
    .right img { width: 360px; height: 360px; object-fit: cover; display: block; margin: 0 auto; border-radius: 4px; }
    .right .cta { margin-top: 14px; font-size: 30px; letter-spacing: 0.5px; color: #8b93a1; max-width: 340px; line-height: 1.25; }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="left">
            <div class="monogram">IV</div>
            <div class="name">{{ name }}</div>
            <div class="title">{{ title }}</div>
            <div class="hr"></div>
            <div class="contacts">
                <div>{{ phone }}</div>
                <div>{{ email }}</div>
            </div>
            <div class="tags">
                {% for tag in tags %}<span>{{ tag }}</span>{% endfor %}
            </div>
        </div>
        <div class="right">
            <img src="{{ photo_uri }}" alt="Igors Volohovs">
            <div class="cta">{{ cta }}</div>
        </div>
    </div>
</body>
</html>
