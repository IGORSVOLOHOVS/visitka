<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Manrope', Arial, sans-serif; }
    .card {
        width: 1119px;
        height: 615px;
        background: #fbfaf8;
        position: relative;
        padding: 56px 80px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 40px;
    }
    .left { max-width: 540px; }
    .name {
        font-weight: 200;
        font-size: 66px;
        color: #111;
        letter-spacing: -1px;
        line-height: 1;
    }
    .rule {
        width: 64px;
        height: 2px;
        background: #111;
        margin: 20px 0 16px;
    }
    .title {
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #8a8a8a;
    }
    .contacts { margin-top: 26px; }
    .contacts div {
        font-weight: 500;
        font-size: 30px;
        color: #333;
        margin-bottom: 10px;
    }
    .tags {
        margin-top: 14px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #b5b0a6;
    }
    .cta {
        margin-top: 22px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #111;
    }
    .photo-wrap { flex: none; }
    .photo-wrap img {
        width: 360px;
        height: 503px;
        object-fit: cover;
        display: block;
        filter: grayscale(100%) contrast(1.05);
    }
</style>
</head>
<body>
    <div class="card" id="card">
        <div class="left">
            <div class="name">{{ name }}</div>
            <div class="rule"></div>
            <div class="title">{{ title }}</div>
            <div class="contacts">
                <div>{{ phone }}</div>
                <div>{{ email }}</div>
                <div class="tags">{{ tags|join(' &middot; ') }}</div>
            </div>
            <div class="cta">{{ cta }}</div>
        </div>
        <div class="photo-wrap">
            <img src="{{ photo_uri }}" alt="Igors Volohovs">
        </div>
    </div>
</body>
</html>
